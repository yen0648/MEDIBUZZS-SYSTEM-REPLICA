<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medicine Inventory Grid</title>

<style>
body {
    font-family: Arial;
    background: #f5f5f5;
    margin: 0;
    padding: 20px;
}

/* 🔙 BACK BUTTON */
.back-btn {
    position: fixed;
    top: 15px;
    left: 15px;

    width: 42px;
    height: 42px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: white;
    border: 2px solid #007bff;
    border-radius: 8px;

    text-decoration: none;
    font-size: 22px;
    color: #007bff;

    box-shadow: 0 3px 10px rgba(0,0,0,0.15);

    transition: 0.2s;
}

.back-btn:hover {
    background: #007bff;
    color: white;
}

h2 {
    text-align: center;
    margin-top: 10px;
}

/* INPUT */
.add-box {
    display: flex;
    gap: 10px;
    max-width: 900px;
    margin: auto;
    margin-bottom: 25px;
}

input {
    flex: 1;
    padding: 12px;
}

button {
    padding: 12px 15px;
    border: none;
    background: #007bff;
    color: white;
    cursor: pointer;
    border-radius: 6px;
}

/* GRID */
.inventory-grid {
    max-width: 1200px;
    margin: auto;

    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 25px;
}

/* CARD */
.card {
    background: white;
    border-radius: 12px;
    padding: 20px;

    text-align: center;
    box-shadow: 0 5px 15px rgba(0,0,0,0.12);

    display: flex;
    flex-direction: column;
    gap: 10px;
}

/* IMAGE BOX */
.img-box {
    width: 100%;
    height: 120px;
    background: linear-gradient(135deg, #dbeafe, #93c5fd);
    border-radius: 10px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 14px;
    font-weight: bold;
    color: #1e3a8a;
}

/* NAME */
.name {
    font-size: 18px;
    font-weight: bold;
}

/* CONTROLS */
.controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
}

.controls button {
    width: 40px;
    height: 40px;
    font-size: 20px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.minus {
    background: red;
    color: white;
}

.plus {
    background: green;
    color: white;
}

.stock {
    font-size: 18px;
    font-weight: bold;
    min-width: 30px;
}

/* RESPONSIVE */
@media (max-width: 1000px) {
    .inventory-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 600px) {
    .inventory-grid {
        grid-template-columns: repeat(1, 1fr);
    }
}
</style>
</head>

<body>

<!-- 🔙 BACK BUTTON -->
<a href="dashboard.html" class="back-btn">←</a>

<h2>Medicine Inventory System</h2>

<!-- INPUT -->
<div class="add-box">
    <input type="text" id="medName" placeholder="Enter medicine name">
    <button onclick="addMedicine()">Add</button>
</div>

<!-- GRID -->
<div class="inventory-grid" id="grid"></div>

<script>

let medicines = [
    { name: "Antibiotics", stock: 0 },
    { name: "Metformin", stock: 0 },
    { name: "Losartan", stock: 0 },
    { name: "Painkillers", stock: 0 }
];

function addMedicine() {
    const name = document.getElementById("medName").value;
    if (name === "") return;

    medicines.push({ name: name, stock: 0 });

    document.getElementById("medName").value = "";
    render();
}

function increase(i) {
    medicines[i].stock++;
    render();
}

function decrease(i) {
    if (medicines[i].stock > 0) {
        medicines[i].stock--;
    }
    render();
}

function render() {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    medicines.forEach((med, i) => {
        grid.innerHTML += `
            <div class="card">

                <div class="img-box">
                    Medicine Image
                </div>

                <div class="name">${med.name}</div>

                <div class="controls">
                    <button class="minus" onclick="decrease(${i})">-</button>
                    <div class="stock">${med.stock}</div>
                    <button class="plus" onclick="increase(${i})">+</button>
                </div>

            </div>
        `;
    });
}

render();

</script>

</body>
</html>
